name: CI

on:
  push:
    branches: [ main, refactor/esbuild-modules ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci   # also runs postinstall (node build.js) -> dist/app.bundle.js

      - name: Syntax check (node -c)
        run: npm run check

      - name: Lint (ESLint — no-undef as the safety net)
        run: npm run lint

      - name: Type check (tsc JSDoc + checkJs)
        run: npm run typecheck

      - name: Run tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"   # includes the bundle architecture guard (window-bridge rule)

      # The step log needs a login to read; annotations do not. When the tests fail, say which ones.
      - name: Name the failing tests (annotations)
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/test.log" ] || exit 0
          grep -E '^[[:space:]]*not ok' "$RUNNER_TEMP/test.log" | head -10 | while IFS= read -r l; do
            echo "::error title=failing test::${l}"
          done
          detail=$(grep -E -A18 '^[[:space:]]*not ok' "$RUNNER_TEMP/test.log" | head -90 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          if [ -n "$detail" ]; then echo "::error title=failing tests, with details::${detail}"; fi

      - name: E2E — migrated modules in a real browser (headless Chrome)
        run: |
          set -o pipefail
          RUN_E2E=1 npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"   # Chrome is preinstalled on ubuntu-latest

      # Same for the e2e: the whole run is ONE test with a subtest per flow, so "exit code 1" alone does not say
      # which flow fell. TAP prints "not ok"; the spec reporter prints a cross.
      - name: Name the failing e2e flows (annotations)
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/e2e.log" ] || exit 0
          grep -E '^[[:space:]]*(not ok|✖)' "$RUNNER_TEMP/e2e.log" | head -10 | while IFS= read -r l; do
            echo "::error title=failing e2e flow::${l}"
          done
          detail=$(grep -E -A18 '^[[:space:]]*(not ok|✖)' "$RUNNER_TEMP/e2e.log" | head -90 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          if [ -n "$detail" ]; then echo "::error title=failing e2e flows, with details::${detail}"; fi
